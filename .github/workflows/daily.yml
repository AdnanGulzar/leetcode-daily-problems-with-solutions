name: Daily LeetCode Commit

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  add-problem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate today's problem
        id: generate
        run: node scripts/daily.js

      - name: Commit and push
        if: steps.generate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add solution for ${{ steps.generate.outputs.id }}. ${{ steps.generate.outputs.title }}"
          git push
